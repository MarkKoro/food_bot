<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>FoodBot — статистика</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --accent-color: #2563eb; /* базовый синий */
        --amb-h: 215; /* hue */
        --amb-a: 0.00; /* alpha */
      }

      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 700px at 50% 0%,
            hsla(var(--amb-h), 85%, 55%, var(--amb-a)) 0%,
            rgba(0,0,0,0) 65%),
          #0b0f18;
        color: #f5f5f5;
        transition: background 0.35s ease;
      }
      .app {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      header {
        margin-bottom: 16px;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.8;
      }
      .app,
      .card,
      .pill-primary {
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }

      .card {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      .date-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .day-switch {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }

      .pill {
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 13px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.95);
        color: #e5e7eb;
        cursor: pointer;
        transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
      }

      .pill-primary {
        background: #22c55e;
        color: #020617;
        border-color: #22c55e;
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
      }

      .pill-secondary {
        background: rgba(15, 23, 42, 0.95);
      }

      .pill-muted {
        opacity: 0.7;
      }

      .date-picker-wrapper {
        position: relative;
        display: inline-flex;
      }

      /* было и остаётся базой: клики идут в кнопку на ПК */
      .date-input-hidden{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        opacity:0;
        z-index:0;
        pointer-events:none;
        cursor:pointer;
      }

      /* ВАЖНО: на телефонах/планшетах делаем прямой tap по input,
         чтобы iOS/Telegram WebView реально открывал календарь */
      @media (pointer: coarse) {
        .date-input-hidden{
          z-index: 3;            /* выше кнопки */
          pointer-events: auto;  /* tap попадает в input */
          opacity: 0.001;        /* почти 0, но некоторые webview "не любят" ровно 0 */
          -webkit-appearance: none;
          appearance: none;
          touch-action: manipulation;
        }
      }

      .macro-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
        font-size: 13px;
      }
      .macro-item span.label {
        opacity: 0.8;
      }
      .macro-item span.value {
        font-weight: 600;
      }
      canvas {
        width: 100% !important;
        max-height: 220px;
        margin-top: 8px;
      }
      .error {
        color: #fecaca;
        font-size: 13px;
        margin-top: 6px;
      }
      .hint {
        font-size: 12px;
        opacity: 0.65;
        margin-top: 4px;
      }

      .card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }

      .card-subtitle {
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
      }

      .today-header{
        display:flex;
        justify-content: space-between;
        align-items:center;
        gap:12px;
        flex-wrap: nowrap; /* важно: не даём “выбрать дату” уезжать вниз на телефоне */
      }
      .today-header > div:first-child{
        flex: 1 1 auto;
        min-width: 0;
      }

      .today-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      .today-date-caption {
        color: #cbd5e1;
        font-size: 13px;
      }

      .today-date-picker{
        display:flex;
        align-items:center;
        gap:10px;
        min-width: 0;
        flex: 0 0 auto;
      }
      .date-label{
        white-space: nowrap;
        opacity: 0.85;
        font-size: 0.9rem;
      }

      .muted {
        color: #94a3b8;
        font-size: 12px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        align-items: start;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        font-size: 13px;
      }

      .today-summary-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }

      .ring-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .progress-ring circle.progress-value {
        stroke: var(--accent-color);
      }

      /* кликабельность */
      .pill, .date-pill { cursor: pointer; }

      /* активный режим (Сегодня/Вчера/Дата) */
      .pill.is-active,
      .date-pill.is-active{
        outline: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
      }

      /* hover для ПК (чтобы было очевидно, что нажимается) */
      @media (hover:hover){
        .pill:hover, .date-pill:hover{
          outline: 1px solid rgba(255,255,255,0.22);
        }
      }

      @media (max-width: 520px){
        .today-date-picker{ gap:8px; }
        .date-label{ font-size:0.85rem; }
        #btn-date.pill{ padding: 6px 10px; }
      }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="page-header">
        <h1>🍽 Грамм — ваша статистика</h1>
      </header>

      <div class="card" id="card-today">
        <div class="today-header">
          <div>
            <div class="today-header-row">
              <h2 id="today-title">Сегодня</h2>
              <span class="today-date-caption" id="today-date-caption"></span>
            </div>
            <div class="day-switch">
              <button id="btnToday" class="pill pill-primary">Сегодня</button>
              <button id="btnYesterday" class="pill pill-secondary">Вчера</button>
            </div>
          </div>

          <div class="today-date-picker">
            <span class="date-label">Выбрать дату</span>
            <div class="date-picker-wrapper">
              <button id="btn-date" class="pill pill-secondary pill-muted" type="button">
                <span id="selected-date-label">Выбрать</span>
              </button>
              <input type="date" id="date-input" class="date-input-hidden" />
            </div>
          </div>
        </div>

        <div id="today-summary"></div>
        <div id="today-macros"></div>
        <p class="hint" id="today-hint"></p>
        <p class="error" id="today-error"></p>
        <canvas id="today-ring"></canvas>
      </div>

      <div class="card" id="card-week">
        <h2>Последние 7 дней</h2>
        <div id="week-summary"></div>
        <canvas id="week-chart"></canvas>
        <div class="hint">Линия показывает калории по дням.</div>
        <div class="error" id="week-error"></div>
      </div>

      <div class="card" id="card-month">
        <h2>Последние 30 дней</h2>
        <canvas id="month-chart"></canvas>
        <div class="error" id="month-error"></div>
      </div>
    </div>

    <script>
      function qs(name) {
        return new URLSearchParams(location.search).get(name);
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function debugEnabled() {
        return qs("debug") === "1";
      }

      function ensureDebugBox() {
        let el = document.getElementById("debugBox");
        if (!el) {
          el = document.createElement("pre");
          el.id = "debugBox";
          el.style.whiteSpace = "pre-wrap";
          el.style.fontSize = "12px";
          el.style.padding = "8px";
          el.style.border = "1px solid rgba(255,255,255,0.2)";
          el.style.marginTop = "12px";
          el.style.display = "none";
          document.body.appendChild(el);
        }
        if (debugEnabled()) el.style.display = "block";
        return el;
      }

      function dlog(msg) {
        if (!debugEnabled()) return;
        const el = ensureDebugBox();
        el.textContent += `${msg}\n`;
      }

      async function waitTelegramUserId(timeoutMs = 2000, stepMs = 50) {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
          const tg = window.Telegram?.WebApp;
          const id = tg?.initDataUnsafe?.user?.id;
          if (id) return { tg, id: String(id) };
          await sleep(stepMs);
        }
        return { tg: window.Telegram?.WebApp, id: null };
      }

      let tg = null;
      let userId = null;

      const todaySummaryEl = document.getElementById("today-summary");
      const todayMacrosEl = document.getElementById("today-macros");
      const todayHintEl = document.getElementById("today-hint");
      const todayErrorEl = document.getElementById("today-error");
      const weekErrorEl = document.getElementById("week-error");
      const monthErrorEl = document.getElementById("month-error");
      const todayTitleEl = document.getElementById("today-title");
      const todayCaptionEl = document.getElementById("today-date-caption");
      const btnToday = document.getElementById("btnToday");
      const btnYesterday = document.getElementById("btnYesterday");
      const btnDate = document.getElementById("btn-date");
      const dateInput = document.getElementById("date-input");
      const selectedDateLabel = document.getElementById("selected-date-label");

      let weekChart = null;
      let monthChart = null;
      let todayRing = null;

      let activeMode = "today"; // "today" | "yesterday" | "date"
      let selectedISO = null;
      let lastLoadedDateIso = null;

      // --- режимы ---
      function setActiveMode(mode) {
        activeMode = mode;

        if (btnToday) {
          btnToday.classList.toggle("pill-primary", mode === "today");
          btnToday.classList.toggle("pill-secondary", mode !== "today");
          btnToday.classList.toggle("is-active", mode === "today");
        }

        if (btnYesterday) {
          btnYesterday.classList.toggle("pill-primary", mode === "yesterday");
          btnYesterday.classList.toggle("pill-secondary", mode !== "yesterday");
          btnYesterday.classList.toggle("is-active", mode === "yesterday");
        }

        if (btnDate) {
          btnDate.classList.toggle("pill-primary", mode === "date");
          btnDate.classList.toggle("pill-secondary", mode !== "date");
          btnDate.classList.toggle("pill-muted", mode !== "date");
          btnDate.classList.toggle("is-active", mode === "date");
        }
      }

      // --- открытие календаря (ПК/телефон) ---
      function openDatePicker() {
        const inp = document.getElementById("date-input");
        if (!inp) return;

        try {
          if (typeof inp.showPicker === "function") {
            inp.showPicker();
            return;
          }
        } catch (e) {}

        inp.focus({ preventScroll: true });
        inp.click();
      }

      (function initDateUi() {
        const dateButton = document.getElementById("btn-date");
        const inp = document.getElementById("date-input");
        if (!dateButton || !inp) return;

        dateButton.addEventListener("click", (e) => {
          e.preventDefault();
          openDatePicker();
        });

        inp.addEventListener("change", () => {
          if (!inp.value) return; // YYYY-MM-DD
          selectedISO = inp.value;
          setActiveMode("date");
          if (typeof loadDay === "function") loadDay("date", selectedISO);
        });
      })();

      function isoToday() {
        const d = new Date();
        return d.toISOString().slice(0, 10);
      }

      function isoYesterday() {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return d.toISOString().slice(0, 10);
      }

      function formatHuman(iso) {
        const [y, m, d] = iso.split("-");
        return `${d}.${m}.${y}`;
      }

      function fmt(value, digits = 0) {
        return Number(value || 0).toFixed(digits);
      }

      function formatDayLabel(dayStr) {
        if (!dayStr || dayStr.length < 10) return dayStr || "";
        const [y, m, d] = dayStr.split("-");
        return `${d}.${m}`;
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      /**
       * percent: 0..100 (можно и больше, мы зажмём)
       * 0%   -> холодный (синий)
       * 50%  -> тёплый (желтоватый)
       * 100% -> зелёный
       */
      function applyAmbientByPercent(percent) {
        const p = clamp(Number(percent) || 0, 0, 100);
        const t = p / 100;

        // hue: 215 -> 50 -> 120
        let hue;
        if (t <= 0.5) hue = lerp(215, 50, t / 0.5);
        else hue = lerp(50, 120, (t - 0.5) / 0.5);

        // alpha: чтобы даже 1% давал еле заметный оттенок
        const alpha = 0.03 + 0.20 * t; // 0.03..0.23

        document.documentElement.style.setProperty("--amb-h", hue.toFixed(1));
        document.documentElement.style.setProperty("--amb-a", alpha.toFixed(3));
      }

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`HTTP ${res.status}: ${body}`);
        }
        return res.json();
      }

      function renderToday(day, title, caption) {
        const totals = day?.totals || {};
        const goal = day?.goal || day?.goals || {};
        const percent = day?.percent || {};

        const kcal = totals.kcal ?? 0;
        const kcalGoal = goal.kcal ?? 0;
        const kcalPercent = kcalGoal > 0 ? (kcal / kcalGoal) * 100 : (percent.kcal ?? 0);

        applyAmbientByPercent(kcalPercent);

        todayTitleEl.textContent = title;
        todayCaptionEl.textContent = caption;

        todaySummaryEl.innerHTML = `
          <div class="summary-grid">
            <div class="macro-item">
              <span class="label">Калории</span>
              <span class="value">${fmt(kcal, 0)} / ${fmt(kcalGoal, 0)} ккал</span>
            </div>
            <div class="macro-item">
              <span class="label">Выполнено</span>
              <span class="value">${fmt(kcalPercent, 0)}%</span>
            </div>
          </div>
        `;

        todayMacrosEl.innerHTML = `
          <div class="macro-grid">
            <div class="macro-item">
              <span class="label">Белки:</span>
              <span class="value">${fmt(totals.protein, 1)} г ${goal.protein ? `/ ${fmt(goal.protein, 1)} г` : ""}</span>
            </div>
            <div class="macro-item">
              <span class="label">Жиры:</span>
              <span class="value">${fmt(totals.fat, 1)} г ${goal.fat ? `/ ${fmt(goal.fat, 1)} г` : ""}</span>
            </div>
            <div class="macro-item">
              <span class="label">Углеводы:</span>
              <span class="value">${fmt(totals.carbs, 1)} г ${goal.carbs ? `/ ${fmt(goal.carbs, 1)} г` : ""}</span>
            </div>
          </div>
        `;

        todayErrorEl.textContent = "";

        const todayRingEl = document.getElementById("today-ring");
        if (todayRing) {
          todayRing.destroy();
        }

        const p = totals.protein || 0;
        const f = totals.fat || 0;
        const c = totals.carbs || 0;
        const sumMacros = p + f + c;

        if (sumMacros > 0 && todayRingEl) {
          todayRing = new Chart(todayRingEl.getContext("2d"), {
            type: "doughnut",
            data: {
              labels: ["Белки", "Жиры", "Углеводы"],
              datasets: [
                {
                  data: [p, f, c],
                },
              ],
            },
            options: {
              plugins: {
                legend: {
                  display: true,
                  labels: {
                    color: "#e5e7eb",
                    font: { size: 11 },
                  },
                },
              },
            },
          });
          todayHintEl.textContent = "";
        } else {
          if (!goal.kcal) {
            todayHintEl.textContent =
              "Цель по КБЖУ пока не задана. Задайте её в настройках бота, чтобы видеть проценты.";
          } else {
            todayHintEl.textContent = "За выбранную дату ещё нет записей.";
          }
        }
      }

      async function loadDay(mode, dateIso) {
        if (!userId) {
          todayErrorEl.textContent =
            "Не передан user_id. В Telegram WebApp он подставится автоматически. В браузере добавьте ?user_id=ВАШ_ID к адресу страницы.";
          return;
        }

        let url;
        let title;
        let caption;
        let effectiveDate = dateIso;

        if (mode === "today") {
          effectiveDate = isoToday();
          url = `/api/stats/day?user_id=${userId}&date=${effectiveDate}`;
          title = "Сегодня";
          caption = `Данные за ${formatHuman(effectiveDate)}`;
        } else if (mode === "yesterday") {
          effectiveDate = isoYesterday();
          url = `/api/stats/day?user_id=${userId}&date=${effectiveDate}`;
          title = "Вчера";
          caption = `Данные за ${formatHuman(effectiveDate)}`;
        } else {
          effectiveDate = dateIso || selectedISO || isoToday();
          url = `/api/stats/day?user_id=${userId}&date=${effectiveDate}`;
          title = formatHuman(effectiveDate);
          caption = `Данные за ${formatHuman(effectiveDate)}`;
        }

        if (mode === "date") {
          selectedISO = effectiveDate;
        }
        lastLoadedDateIso = effectiveDate;
        if (selectedDateLabel) {
          selectedDateLabel.textContent = formatHuman(effectiveDate);
        }
        if (btnDate) {
          btnDate.setAttribute("aria-label", `Выбрать дату ${formatHuman(effectiveDate)}`);
        }
        if (dateInput) {
          dateInput.value = effectiveDate;
        }

        try {
          const stats = await fetchJson(url);
          renderToday(stats, title, caption);
        } catch (err) {
          console.error(err);
          dlog(err?.stack || String(err));
          todayErrorEl.textContent = "Ошибка загрузки данных.";
        }
      }

      function buildWeekChart(history) {
        const labels = history.map((d) => formatDayLabel(d.day));
        const kcalData = history.map((d) => d.kcal || 0);

        const ctx = document.getElementById("week-chart").getContext("2d");
        if (weekChart) {
          weekChart.destroy();
        }

        weekChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Калории",
                data: kcalData,
                borderColor: "rgba(59, 130, 246, 0.9)",
                backgroundColor: "rgba(59, 130, 246, 0.2)",
                fill: true,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
              y: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
            },
          },
        });
      }

      function buildMonthChart(history) {
        const labels = history.map((d) => formatDayLabel(d.day));
        const kcalData = history.map((d) => d.kcal || 0);

        const ctx = document.getElementById("month-chart").getContext("2d");
        if (monthChart) {
          monthChart.destroy();
        }
        monthChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Калории",
                data: kcalData,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#cbd5f5", font: { size: 9 } },
              },
              y: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
            },
          },
        });
      }

      async function loadHistory() {
        if (!userId) return;
        try {
          const [week, month] = await Promise.all([
            fetchJson(`/api/stats/history?user_id=${userId}&days=7`),
            fetchJson(`/api/stats/history?user_id=${userId}&days=30`),
          ]);

          buildWeekChart(week.items || []);
          buildMonthChart(month.items || []);
          weekErrorEl.textContent = "";
          monthErrorEl.textContent = "";
        } catch (err) {
          console.error(err);
          dlog(err?.stack || String(err));
          weekErrorEl.textContent = "Ошибка загрузки данных.";
          monthErrorEl.textContent = "Ошибка загрузки данных.";
        }
      }

      btnToday?.addEventListener("click", () => {
        setActiveMode("today");
        loadDay("today");
      });

      btnYesterday?.addEventListener("click", () => {
        setActiveMode("yesterday");
        loadDay("yesterday");
      });

      (async function init() {
        const waited = await waitTelegramUserId();
        tg = waited.tg;

        try {
          tg?.ready?.();
          tg?.expand?.();
        } catch (err) {
          console.warn("Telegram WebApp ready/expand error", err);
          dlog(err?.stack || String(err));
        }

        const tgUserId = waited.id;
        userId = tgUserId || qs("user_id");
        if (!userId) {
          const errMsg =
            "Не передан user_id. В Telegram WebApp он подставится автоматически. В браузере добавьте ?user_id=ВАШ_ID к адресу страницы.";
          todayErrorEl.textContent = errMsg;
          dlog(errMsg);
          return;
        }

        setActiveMode("today");
        await loadDay("today");
        await loadHistory();
      })();
    </script>
  </body>
</html>
