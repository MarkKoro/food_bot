<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>FoodBot — статистика</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050816;
        color: #f5f5f5;
      }
      .app {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      header {
        margin-bottom: 16px;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.8;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .pill {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(30, 64, 175, 0.6);
      }
      .macro-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
        font-size: 13px;
      }
      .macro-item span.label {
        opacity: 0.8;
      }
      .macro-item span.value {
        font-weight: 600;
      }
      canvas {
        width: 100% !important;
        max-height: 220px;
        margin-top: 8px;
      }
      .error {
        color: #fecaca;
        font-size: 13px;
        margin-top: 6px;
      }
      .hint {
        font-size: 12px;
        opacity: 0.65;
        margin-top: 4px;
      }

      .card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }

      .card-subtitle {
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        align-items: start;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        font-size: 13px;
      }

      .ring-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .pill-primary {
        background: rgba(59, 130, 246, 0.8);
        color: #e5e7eb;
        border: none;
        cursor: pointer;
      }

      .date-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }

      .date-picker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .date-picker input[type="date"] {
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        font-size: 0.9rem;
      }

      .date-picker input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="page-header">
        <h1>🍽 Грамм — ваша статистика</h1>
      </header>

      <div class="card" id="card-today">
        <div class="card-header">
          <h2>Сегодня</h2>
          <p class="card-subtitle" id="today-date-label">...</p>
        </div>

        <div class="date-row">
          <button class="pill pill-primary" id="day-today-btn">Сегодня</button>
          <div class="date-picker">
            <span>или выбрать дату:</span>
            <input type="date" id="day-date-input" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <div id="today-summary" class="summary-grid"></div>
            <p class="hint" id="today-hint"></p>
            <p class="error" id="today-error"></p>
          </div>
          <div class="ring-wrapper">
            <canvas id="today-ring"></canvas>
          </div>
        </div>
      </div>

      <div class="card" id="card-week">
        <h2>Последние 7 дней</h2>
        <div id="week-summary"></div>
        <canvas id="week-chart"></canvas>
        <div class="hint">Линия показывает калории по дням.</div>
        <div class="error" id="week-error"></div>
      </div>

      <div class="card" id="card-month">
        <h2>Последние 30 дней</h2>
        <canvas id="month-chart"></canvas>
        <div class="error" id="month-error"></div>
      </div>
    </div>

    <script>
      const todaySummaryEl = document.getElementById("today-summary");
      const todayHintEl = document.getElementById("today-hint");
      const todayErrorEl = document.getElementById("today-error");
      const weekSummaryEl = document.getElementById("week-summary");
      const weekErrorEl = document.getElementById("week-error");
      const monthErrorEl = document.getElementById("month-error");

      const dateInputEl = document.getElementById("day-date-input");
      const dateTodayBtn = document.getElementById("day-today-btn");

      const tg = window.Telegram && window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

      let userId = null;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        userId = String(tg.initDataUnsafe.user.id);
        try {
          tg.ready();
        } catch (e) {
          console.log("Telegram WebApp ready error:", e);
        }
      } else {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = params.get("user_id");
        if (fromQuery) {
          userId = fromQuery;
        }
      }

      let weekChart = null;
      let monthChart = null;
      let todayRing = null;

      // Состояние: текущий "сегодня" и история за 30 дней
      let todaySummary = null;
      let monthHistory = [];

      function fmt(value, digits = 0) {
        return Number(value || 0).toFixed(digits);
      }

      function formatDayLabel(dayStr) {
        // Ожидаем формат YYYY-MM-DD
        if (!dayStr || dayStr.length < 10) return dayStr || "";
        const [y, m, d] = dayStr.split("-");
        return `${d}.${m}`;
      }

      function setDateInputToToday() {
        if (!dateInputEl) return;
        const now = new Date();
        const iso = now.toISOString().slice(0, 10); // YYYY-MM-DD
        dateInputEl.value = iso;
      }

      function buildTodayBlock(data) {
        const totals = data.totals || {};
        const goal = data.goal || null;
        const percent = data.percent || {};

        const dateLabelEl = document.getElementById("today-date-label");
        const dateValue = data.date || data.day || null;
        if (dateLabelEl) {
          const dateLabel = dateValue ? `Данные за ${formatDayLabel(dateValue)}` : "Данные за сегодня";
          dateLabelEl.textContent = dateLabel;
        }

        const kcal = fmt(totals.kcal);
        const kcalGoal = goal ? fmt(goal.kcal) : "—";
        const kcalPercent =
          percent.kcal !== null && percent.kcal !== undefined
            ? percent.kcal + "%"
            : "—";

        todaySummaryEl.innerHTML = `
          <div class="row">
            <div class="pill">Сегодня: ${kcal} / ${kcalGoal} ккал</div>
            <div class="pill">Выполнено: ${kcalPercent}</div>
          </div>
          <div class="summary-grid">
            <div class="macro-item">
              <span class="label">Белки:</span>
              <span class="value"> ${fmt(totals.protein, 1)} г ${goal ? "/ " + fmt(goal.protein, 1) + " г" : ""}</span>
            </div>
            <div class="macro-item">
              <span class="label">Жиры:</span>
              <span class="value"> ${fmt(totals.fat, 1)} г ${goal ? "/ " + fmt(goal.fat, 1) + " г" : ""}</span>
            </div>
            <div class="macro-item">
              <span class="label">Углеводы:</span>
              <span class="value"> ${fmt(totals.carbs, 1)} г ${goal ? "/ " + fmt(goal.carbs, 1) + " г" : ""}</span>
            </div>
          </div>
        `;

        // Круговой график распределения Б/Ж/У за сегодня
        const todayRingEl = document.getElementById("today-ring");
        if (todayRing) {
          todayRing.destroy();
        }

        const p = totals.protein || 0;
        const f = totals.fat || 0;
        const c = totals.carbs || 0;
        const sumMacros = p + f + c;

        if (sumMacros > 0 && todayRingEl) {
          todayRing = new Chart(todayRingEl.getContext("2d"), {
            type: "doughnut",
            data: {
              labels: ["Белки", "Жиры", "Углеводы"],
              datasets: [
                {
                  data: [p, f, c],
                },
              ],
            },
            options: {
              plugins: {
                legend: {
                  display: true,
                  labels: {
                    color: "#e5e7eb",
                    font: { size: 11 },
                  },
                },
              },
            },
          });
          if (goal) {
            // Подсказку под кругом не показываем, просто оставляем пусто
            if (todayHintEl) {
              todayHintEl.textContent = "";
            }
          }
        } else {
          // Если приёмов ещё не было — просто подсказка
          if (!goal) {
            todayHintEl.textContent =
              "Цель по КБЖУ пока не задана. Задайте её в настройках бота, чтобы видеть проценты.";
          } else if (!todayHintEl.textContent) {
            todayHintEl.textContent =
              "Сегодня ещё не было сохранённых приёмов пищи.";
          }
        }
      }

      function buildWeekChart(history) {
        const labels = history.map((d) => formatDayLabel(d.day));
        const kcalData = history.map((d) => d.kcal || 0);

        const ctx = document.getElementById("week-chart").getContext("2d");
        if (weekChart) {
          weekChart.destroy();
        }
        weekChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Калории",
                data: kcalData,
                tension: 0.3,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
              y: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
            },
          },
        });

        const sum = kcalData.reduce((a, b) => a + b, 0);
        weekSummaryEl.innerHTML = `
          <div class="row">
            <div class="pill">Итого за 7 дней: ${fmt(sum)} ккал</div>
          </div>
        `;
      }

      function buildMonthChart(history) {
        const labels = history.map((d) => formatDayLabel(d.day));
        const kcalData = history.map((d) => d.kcal || 0);

        const ctx = document.getElementById("month-chart").getContext("2d");
        if (monthChart) {
          monthChart.destroy();
        }
        monthChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Калории",
                data: kcalData,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#cbd5f5", font: { size: 9 } },
              },
              y: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
            },
          },
        });
      }

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        return res.json();
      }

      async function init() {
        if (!userId) {
          todayErrorEl.textContent =
            "Не передан user_id. В Telegram WebApp он подставится автоматически. В браузере добавьте ?user_id=ВАШ_ID к адресу страницы.";
          weekErrorEl.textContent = "";
          monthErrorEl.textContent = "";
          return;
        }

        try {
          const [today, week, month] = await Promise.all([
            fetchJson(`/api/stats/today?user_id=${userId}`),
            fetchJson(`/api/stats/history?user_id=${userId}&days=7`),
            fetchJson(`/api/stats/history?user_id=${userId}&days=30`),
          ]);

          // Сохраняем данные в состояние
          todaySummary = today;
          monthHistory = Array.isArray(month.items) ? month.items : [];

          // По умолчанию — сегодня
          setDateInputToToday();
          buildTodayBlock(today);
          buildWeekChart(week.items || []);
          buildMonthChart(month.items || []);

          // Навешиваем обработчики выбора даты
          if (dateTodayBtn && dateInputEl) {
            dateTodayBtn.addEventListener("click", () => {
              setDateInputToToday();
              if (todaySummary) {
                todayErrorEl.textContent = "";
                buildTodayBlock(todaySummary);
              }
            });

            dateInputEl.addEventListener("change", () => {
              const value = dateInputEl.value;
              if (!value || !monthHistory.length) {
                return;
              }

              // Здесь пока просто показываем выбранную дату в заголовке и,
              // если данных нет, сообщение об этом. Логику полного пересчёта
              // по конкретному дню сделаем отдельным шагом.
              const dayData = monthHistory.find((d) => d.day === value);

              if (!dayData) {
                // Нет записей за этот день — показываем пустой день
                todayErrorEl.textContent = "За этот день ещё нет записей.";
                // Пока оставляем метрики как у todaySummary, но дата в заголовке меняется.
                if (todaySummary) {
                  const clone = { ...todaySummary, date: value };
                  buildTodayBlock(clone);
                }
                return;
              }

              // TODO: следующими шагами:
              // 1) собрать daySummary из dayData (ккал, Б/Ж/У),
              // 2) передать в buildTodayBlock(daySummary).
              // Сейчас просто убираем ошибку и оставляем отображение "сегодня".
              todayErrorEl.textContent = "";
            });
          }
        } catch (err) {
          console.error(err);
          todayErrorEl.textContent = "Ошибка загрузки данных.";
          weekErrorEl.textContent = "Ошибка загрузки данных.";
          monthErrorEl.textContent = "Ошибка загрузки данных.";
        }
      }

      init();
    </script>
  </body>
</html>
