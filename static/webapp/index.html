<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>FoodBot — статистика</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --accent-color: #2563eb; /* базовый синий */
      }

      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 0 0, #020617 0, #020617 40%);
        color: #f5f5f5;
        transition: background 0.35s ease;
      }
      .app {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      header {
        margin-bottom: 16px;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.8;
      }
      .app,
      .card,
      .pill-primary {
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }

      .card {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .pill {
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(30, 64, 175, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #e5e7eb;
        cursor: pointer;
      }

      .pill-small {
        padding: 4px 10px;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.05);
      }

      .pill-date {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(59, 130, 246, 0.18);
        border: 1px solid rgba(59, 130, 246, 0.35);
        color: #e5e7eb;
      }

      .pill-date-icon {
        font-size: 13px;
        opacity: 0.85;
      }
      .macro-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
        font-size: 13px;
      }
      .macro-item span.label {
        opacity: 0.8;
      }
      .macro-item span.value {
        font-weight: 600;
      }
      canvas {
        width: 100% !important;
        max-height: 220px;
        margin-top: 8px;
      }
      .error {
        color: #fecaca;
        font-size: 13px;
        margin-top: 6px;
      }
      .hint {
        font-size: 12px;
        opacity: 0.65;
        margin-top: 4px;
      }

      .card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }

      .card-subtitle {
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        align-items: start;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        font-size: 13px;
      }

      .today-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .today-title-side h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }

      .today-quick-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .today-date-side {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .today-date-label {
        opacity: 0.8;
        font-size: 13px;
      }

      .today-summary-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .pill-outline {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: #e2e8f0;
      }

      .hidden-date-input {
        position: absolute;
        left: -9999px;
        opacity: 0;
        pointer-events: none;
      }

      .ring-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .progress-ring circle.progress-value {
        stroke: var(--accent-color);
      }

      .pill-primary {
        background-color: var(--accent-color);
        color: #e5e7eb;
        border: none;
        cursor: pointer;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
      }

      .date-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }

      .date-picker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .date-picker input[type="date"] {
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #020617;
        color: #e5e7eb;
        font-size: 0.9rem;
      }

      .date-picker input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="page-header">
        <h1>🍽 Грамм — ваша статистика</h1>
      </header>

      <div class="card" id="card-today">
        <div class="today-header-row">
          <div class="today-title-side">
            <h2>Сегодня</h2>
            <div class="today-quick-buttons">
              <button class="pill pill-small" data-day="today" id="btn-today">Сегодня</button>
              <button class="pill pill-small" data-day="yesterday" id="btn-yesterday">Вчера</button>
            </div>
          </div>

          <div class="today-date-side">
            <span class="today-date-label">Данные за</span>
            <button class="pill pill-date" id="btn-date-picker">
              <span id="selected-date-label">—</span>
              <span class="pill-date-icon">📅</span>
            </button>
            <input type="date" id="date-input" class="hidden-date-input" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <div id="today-summary" class="summary-grid"></div>
            <p class="hint" id="today-hint"></p>
            <p class="error" id="today-error"></p>
          </div>
          <div class="ring-wrapper">
            <canvas id="today-ring"></canvas>
          </div>
        </div>
      </div>

      <div class="card" id="card-week">
        <h2>Последние 7 дней</h2>
        <div id="week-summary"></div>
        <canvas id="week-chart"></canvas>
        <div class="hint">Линия показывает калории по дням.</div>
        <div class="error" id="week-error"></div>
      </div>

      <div class="card" id="card-month">
        <h2>Последние 30 дней</h2>
        <canvas id="month-chart"></canvas>
        <div class="error" id="month-error"></div>
      </div>
    </div>

    <script>
      const todaySummaryEl = document.getElementById("today-summary");
      const todayHintEl = document.getElementById("today-hint");
      const todayErrorEl = document.getElementById("today-error");
      const weekSummaryEl = document.getElementById("week-summary");
      const weekErrorEl = document.getElementById("week-error");
      const monthErrorEl = document.getElementById("month-error");

      const selectedDateLabelEl = document.getElementById("selected-date-label");
      const dateInputEl = document.getElementById("date-input");
      const dateTodayBtn = document.getElementById("btn-today");
      const dateYesterdayBtn = document.getElementById("btn-yesterday");
      const datePickerBtn = document.getElementById("btn-date-picker");

      const tg = window.Telegram && window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

      let userId = null;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        userId = String(tg.initDataUnsafe.user.id);
        try {
          tg.ready();
        } catch (e) {
          console.log("Telegram WebApp ready error:", e);
        }
      } else {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = params.get("user_id");
        if (fromQuery) {
          userId = fromQuery;
        }
      }

      let weekChart = null;
      let monthChart = null;
      let todayRing = null;

      let todaySummary = null;
      let monthHistory = [];
      let currentDate = null;
      let todayIso = null;

      function fmt(value, digits = 0) {
        return Number(value || 0).toFixed(digits);
      }

      function formatDayLabel(dayStr) {
        // Ожидаем формат YYYY-MM-DD
        if (!dayStr || dayStr.length < 10) return dayStr || "";
        const [y, m, d] = dayStr.split("-");
        return `${d}.${m}`;
      }

      function formatIsoDate(dateIso) {
        if (!dateIso) return "—";
        return dateIso.split("-").reverse().join(".");
      }

      function updateThemeByProgress(percent) {
        // допускаем чуть больше 100%, чтобы "перекорм" тоже загорался
        const clamped = Math.max(0, Math.min(percent, 130)) / 100;

        // 0%  -> оранжево-жёлтый
        // 50% -> мягкий жёлто-зелёный
        // 100%+ -> зелёный
        const hueStart = 38; // ~оранжевый
        const hueEnd = 135; // ~зелёный

        const hue = hueStart + (hueEnd - hueStart) * clamped;
        const accent = `hsl(${hue} 90% 55%)`;

        document.documentElement.style.setProperty("--accent-color", accent);

        // фон страницы – лёгкий градиент с оттенком прогресса
        document.body.style.background =
          `radial-gradient(circle at 0 0, ${accent}22 0, #020617 45%, #020617 100%)`;
      }

      function buildTodaySummary(today) {
        const totals = today.totals || {};
        const goal = today.goal || {};
        const kcal = totals.kcal ?? 0;
        const kcalGoal = goal.kcal ?? 0;
        const kcalPercent = today.percent?.kcal ?? 0;

        todaySummaryEl.innerHTML = `
          <div class="today-summary-row">
            <div class="pill pill-primary">
              Баланс дня: ${kcal.toFixed(0)} / ${kcalGoal.toFixed(0)} ккал
            </div>
            <div class="pill pill-outline">
              Выполнено: ${kcalPercent.toFixed(0)}%
            </div>
          </div>
          <div class="summary-grid">
            <div class="macro-item">
              <span class="label">Белки:</span>
              <span class="value"> ${fmt(totals.protein, 1)} г ${goal.protein ? "/ " + fmt(goal.protein, 1) + " г" : ""}</span>
            </div>
            <div class="macro-item">
              <span class="label">Жиры:</span>
              <span class="value"> ${fmt(totals.fat, 1)} г ${goal.fat ? "/ " + fmt(goal.fat, 1) + " г" : ""}</span>
            </div>
            <div class="macro-item">
              <span class="label">Углеводы:</span>
              <span class="value"> ${fmt(totals.carbs, 1)} г ${goal.carbs ? "/ " + fmt(goal.carbs, 1) + " г" : ""}</span>
            </div>
          </div>
        `;

        updateThemeByProgress(kcalPercent);

        const todayRingEl = document.getElementById("today-ring");
        if (todayRing) {
          todayRing.destroy();
        }

        const p = totals.protein || 0;
        const f = totals.fat || 0;
        const c = totals.carbs || 0;
        const sumMacros = p + f + c;

        if (sumMacros > 0 && todayRingEl) {
          todayRing = new Chart(todayRingEl.getContext("2d"), {
            type: "doughnut",
            data: {
              labels: ["Белки", "Жиры", "Углеводы"],
              datasets: [
                {
                  data: [p, f, c],
                },
              ],
            },
            options: {
              plugins: {
                legend: {
                  display: true,
                  labels: {
                    color: "#e5e7eb",
                    font: { size: 11 },
                  },
                },
              },
            },
          });
          todayHintEl.textContent = "";
        } else {
          if (!goal.kcal) {
            todayHintEl.textContent =
              "Цель по КБЖУ пока не задана. Задайте её в настройках бота, чтобы видеть проценты.";
          } else {
            todayHintEl.textContent = "За выбранную дату ещё нет записей.";
          }
        }
      }

      function buildWeekChart(history) {
        const labels = history.map((d) => formatDayLabel(d.day));
        const kcalData = history.map((d) => d.kcal || 0);

        const ctx = document.getElementById("week-chart").getContext("2d");
        if (weekChart) {
          weekChart.destroy();
        }

        weekChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Калории",
                data: kcalData,
                borderColor: "rgba(59, 130, 246, 0.9)",
                backgroundColor: "rgba(59, 130, 246, 0.2)",
                fill: true,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
              y: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
            },
          },
        });
      }

      function buildMonthChart(history) {
        const labels = history.map((d) => formatDayLabel(d.day));
        const kcalData = history.map((d) => d.kcal || 0);

        const ctx = document.getElementById("month-chart").getContext("2d");
        if (monthChart) {
          monthChart.destroy();
        }
        monthChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Калории",
                data: kcalData,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#cbd5f5", font: { size: 9 } },
              },
              y: {
                ticks: { color: "#cbd5f5", font: { size: 10 } },
              },
            },
          },
        });
      }

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        return res.json();
      }

      async function loadStatsFor(dateIso) {
        const params = new URLSearchParams(window.location.search);
        const userIdFromQuery = params.get("user_id") || userId;

        const resp = await fetch(
          `/api/stats/day?user_id=${userIdFromQuery}&date=${dateIso}`
        );
        if (!resp.ok) throw new Error("Не удалось загрузить данные за день");
        const dayStats = await resp.json();

        todayErrorEl.textContent = "";
        buildTodaySummary(dayStats);
        return dayStats;
      }

      function setSelectedDate(dateIso) {
        currentDate = dateIso;
        if (selectedDateLabelEl) {
          selectedDateLabelEl.textContent = formatIsoDate(dateIso);
        }
        return loadStatsFor(dateIso);
      }

      async function init() {
        if (!userId) {
          todayErrorEl.textContent =
            "Не передан user_id. В Telegram WebApp он подставится автоматически. В браузере добавьте ?user_id=ВАШ_ID к адресу страницы.";
          weekErrorEl.textContent = "";
          monthErrorEl.textContent = "";
          return;
        }

        try {
          const todayResp = await fetchJson(`/api/stats/today?user_id=${userId}`);
          todaySummary = todayResp;
          todayIso = todayResp.day;

          await setSelectedDate(todayIso);

          const [week, month] = await Promise.all([
            fetchJson(`/api/stats/history?user_id=${userId}&days=7`),
            fetchJson(`/api/stats/history?user_id=${userId}&days=30`),
          ]);

          monthHistory = Array.isArray(month.items) ? month.items : [];
          buildWeekChart(week.items || []);
          buildMonthChart(month.items || []);

          if (dateTodayBtn) {
            dateTodayBtn.onclick = () => setSelectedDate(todayIso);
          }

          if (dateYesterdayBtn) {
            dateYesterdayBtn.onclick = () => {
              const d = new Date(todayIso);
              d.setDate(d.getDate() - 1);
              const iso = d.toISOString().slice(0, 10);
              setSelectedDate(iso);
            };
          }

          if (datePickerBtn && dateInputEl) {
            datePickerBtn.onclick = () => {
              if (dateInputEl.showPicker) {
                dateInputEl.showPicker();
              } else {
                dateInputEl.click();
              }
            };
            dateInputEl.onchange = () => {
              if (dateInputEl.value) setSelectedDate(dateInputEl.value);
            };
          }
        } catch (err) {
          console.error(err);
          todayErrorEl.textContent = "Ошибка загрузки данных.";
          weekErrorEl.textContent = "Ошибка загрузки данных.";
          monthErrorEl.textContent = "Ошибка загрузки данных.";
        }
      }

      init();
    </script>
  </body>
</html>
