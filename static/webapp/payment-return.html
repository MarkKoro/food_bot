<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Возврат после оплаты</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0b0f18; color: #f5f5f5; }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
      .card { max-width: 520px; background: rgba(15,23,42,.9); border: 1px solid rgba(148,163,184,.25); border-radius: 16px; padding: 20px; }
      a { color: #60a5fa; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Оплата обработана</h1>
        <p>Вернитесь в Telegram.</p>
        <p><a id="bot-link" href="#" target="_blank" rel="noopener">Открыть бота</a></p>
      </div>
    </div>
    <script>
      (async function () {
        let username = "";
        try {
          const r = await fetch('/api/config');
          const cfg = await r.json();
          username = String(cfg?.bot_username || '').replace(/^@/, '');
        } catch (_) {}
        const link = document.getElementById('bot-link');
        const href = username ? `https://t.me/${username}` : 'https://t.me';
        link.href = href;
        link.textContent = href;
      })();
    </script>
  </body>
</html>
